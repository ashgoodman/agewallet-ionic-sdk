<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AgeWallet SDK Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      min-height: 100vh;
      padding: 24px;
      padding-top: env(safe-area-inset-top, 24px);
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    .container { max-width: 420px; margin: 0 auto; }
    .icon-container {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px auto 16px;
      font-size: 40px;
    }
    .icon-container.locked { background: rgba(99, 102, 241, 0.1); }
    .icon-container.verified { background: rgba(16, 185, 129, 0.1); }
    h1 {
      font-size: 22px;
      font-weight: bold;
      color: #1f2937;
      margin-bottom: 8px;
      text-align: center;
    }
    p.lead {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
      text-align: center;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    .help {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: #6366f1;
      color: white;
      width: 100%;
      margin-top: 20px;
    }
    .btn-outline {
      background: white;
      color: #6366f1;
      border: 1px solid #6366f1;
      width: 100%;
      margin-top: 8px;
    }
    .btn-secondary {
      background: white;
      color: #6b7280;
      border: 1px solid #e5e7eb;
      width: 100%;
    }
    .btn-small {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      background: white;
      color: #374151;
      border: 1px solid #d1d5db;
    }
    .loading { display: none; text-align: center; padding: 40px 0; }
    .loading.show { display: block; }
    #unverified-view, #verified-view { display: none; }
    #unverified-view.show, #verified-view.show { display: block; }
    .metadata-box {
      background: #f3f4f6;
      border-radius: 8px;
      padding: 12px;
      margin: 16px 0;
    }
    .metadata-label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .metadata-value {
      font-size: 13px;
      font-family: monospace;
      color: #1f2937;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading" class="loading show">
      <p>Loading...</p>
    </div>

    <div id="unverified-view">
      <div class="icon-container locked">🔒</div>
      <h1>Age Verification Required</h1>
      <p class="lead">You must verify your age to access this content.</p>

      <label>Default metadata (auto)</label>
      <div class="metadata-box" id="auto-default-display">(loading)</div>

      <label for="metadata-custom">Custom metadata (optional, appended for this call only)</label>
      <input type="text" id="metadata-custom" placeholder="e.g. order-1234">
      <p class="help" id="metadata-custom-help">If populated, sent as "&lt;default&gt; | &lt;your text&gt;" for this verification only.</p>

      <button id="verify-btn" class="btn-primary">Verify with AgeWallet</button>
    </div>

    <div id="verified-view">
      <div class="icon-container verified">✓</div>
      <h1>Age Verified</h1>
      <p class="lead">You have successfully verified your age.</p>
      <div class="metadata-box">
        <div class="metadata-label">Metadata attached to current verification:</div>
        <div class="metadata-value" id="metadata-display">(none)</div>
      </div>
      <button id="clear-btn" class="btn-secondary">Clear Verification</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
